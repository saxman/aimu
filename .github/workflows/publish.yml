name: Publish to PyPI

# Publishing is triggered by the release tag itself, so pushing `vX.Y.Z` is the
# single act that ships -- matching how releases were cut by hand before this
# existed. There is deliberately no workflow_dispatch: a publish needs to be
# anchored to a tag, and a failed run can be re-run from the Actions UI.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `uvx ruff` needs no project install, so this gate costs seconds rather than the
      # several minutes a full `uv sync --all-extras` takes.
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .

  publish:
    name: Publish
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token PyPI trusted publishing exchanges for an upload token.
      # Scoped to this job alone; the test job above needs no permissions at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        # A forgotten `0.21.0.dev0` -> `0.21.0` bump is otherwise invisible until
        # the wrong version is on PyPI under a tag claiming otherwise, and a
        # version number cannot be reused once published.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version '$tag' but pyproject.toml says '$packaged'"
            exit 1
          fi
          echo "tag and pyproject agree on $packaged"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the artifacts
        run: uvx twine check dist/*

      - name: Publish to PyPI
        # Trusted publishing: no token is stored anywhere. Requires a one-time
        # trusted-publisher entry on PyPI naming this repo and this workflow file.
        uses: pypa/gh-action-pypi-publish@release/v1
