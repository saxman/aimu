name: Publish to PyPI

# Publishing is triggered by the release tag itself, so pushing `vX.Y.Z` is the
# single act that ships -- matching how releases were cut by hand before this
# existed. There is deliberately no workflow_dispatch: a publish needs to be
# anchored to a tag, and a failed run can be re-run from the Actions UI.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        # `uv sync` installs the committed uv.lock, so CI gets byte-for-byte what a
        # developer running the documented `uv sync --all-extras` has. Resolving fresh
        # here instead (`pip install -e '.[all,dev]'`) is what broke the first run of
        # this workflow: pip backtracked past a transitive conflict and landed on
        # deepeval 2.6.6, which imports langchain without declaring it -- and since
        # deepeval registers a pytest11 plugin, that import failure took down the whole
        # suite at startup, on a tree no developer had ever run.
        #
        # --all-extras is required, not merely thorough: several test modules import
        # provider catalogs at module scope (test_docs_model_matrix imports
        # LlamaCppModel), so a missing extra fails collection rather than skipping,
        # which would silently gut the catalog guards.
        #
        # 3.11 is the floor pyproject promises, so it is the version most likely to
        # catch a syntax or stdlib assumption newer runtimes forgive. llama-cpp-python
        # publishes an sdist only and compiles from source, so a cold run is slow;
        # enable-cache above makes later runs reuse the built wheel.
        run: uv sync --all-extras --python 3.11
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token PyPI trusted publishing exchanges for an upload token.
      # Scoped to this job alone; the test job above needs no permissions at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        # A forgotten `0.21.0.dev0` -> `0.21.0` bump is otherwise invisible until
        # the wrong version is on PyPI under a tag claiming otherwise, and a
        # version number cannot be reused once published.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version '$tag' but pyproject.toml says '$packaged'"
            exit 1
          fi
          echo "tag and pyproject agree on $packaged"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the artifacts
        run: uvx twine check dist/*

      - name: Publish to PyPI
        # Trusted publishing: no token is stored anywhere. Requires a one-time
        # trusted-publisher entry on PyPI naming this repo and this workflow file.
        uses: pypa/gh-action-pypi-publish@release/v1
